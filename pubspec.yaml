name: chicas_app
description: "Aplicación social para conectar y conocer personas."
publish_to: "none"

version: 33.2.0+3

environment:
  sdk: ^3.9.0

dependencies:
  camera: ^0.11.2+2
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Riverpod State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation and Dependency Injection
  flutter_modular: ^6.3.4

  # HTTP and JSON
  dio: ^5.4.0
  json_annotation: ^4.8.1

  image_picker: ^1.0.7
  image_picker_web: ^3.1.1

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/profile1.jpg
    - assets/profile2.jpg
    - assets/profile3.jpg
    - assets/profile4.jpg
    - assets/profile5.jpg
    - assets/filtro.png
    - assets/filtro1.jpg
    - assets/filtro2.jpg
    - assets/images/profiles/
